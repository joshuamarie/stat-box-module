name: "Run executable scripts"
description: "For the sake of integration of statmodule with `{carrier}`, let us verify its integration to `{carrier}` by running the scripts."

on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:

jobs:
    box-integration:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        steps:
            - uses: actions/checkout@v4

            # ---------- Carrier installation ----------
            # Linux & macOS uses bash installer
            - name: "Carrier installation (Unix)"
              if: runner.os != 'Windows'
              shell: bash
              run: |
                  # Temporary workaround for the arm64 vs aarch64 naming mismatch
                  curl -LsSf https://github.com/joshuamarie/carrier/releases/download/v0.2.3/carrier-installer.sh \
                    | sed 's/arm64-apple-darwin/aarch64-apple-darwin/g' \
                    | bash

            # Official PowerShell installer for Windows
            - name: "Carrier installation (Windows)"
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  irm https://github.com/joshuamarie/carrier/releases/download/v0.2.3/carrier-installer.ps1 | iex

            - name: "R 4.5.1 Setup"
              uses: r-lib/actions/setup-r@v2
              with:
                  r-version: "4.5.1"
                  use-public-rspm: true

            - name: "Install the patched {box} fork"
              run: |
                  Rscript -e 'install.packages("pak")'
                  Rscript -e 'pak::pak("joshuamarie/box@feature/carrier-module-support")'

            - name: "Install statmodule (here)"
              shell: bash
              run: |
                  # Make sure carrier is on PATH (especially important on Windows / Git Bash)
                  export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
                  carrier --version || true          # optional sanity check
                  carrier install . --install-deps

            - name: "Execute scripts from scripts/examples"
              shell: bash
              run: |
                  export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
                  for rs in ./scripts/examples/*.r; do
                      if head -1 "$rs" | grep -q '^#!/usr/bin/env rscript'; then
                          echo "==== Running $rs"
                          "$rs"
                      fi
                  done
